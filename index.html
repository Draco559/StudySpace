<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b31"><meta name="description" content="StudySpace keeps homework, notes, grades and school plans together."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>StudySpace — Schoolwork, organised</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip-link" href="#main">Skip to content</a><div class="app"><div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div><aside class="sidebar" id="sidebar"><div class="brand"><span>StudySpace</span></div><div class="subtitle">Your work, in one place.</div><div class="nav-search-wrap"><input id="pageSearch" class="nav-search" type="search" placeholder="Find a section..." aria-label="Find a section" autocomplete="off"></div><div class="nav-label">WORKSPACE</div><nav id="navigation" aria-label="Main navigation"><button class="nav active" data-page="dashboard">Home</button><button class="nav" data-page="assignments">Homework & tasks</button><button class="nav" data-page="timetable">Timetable</button><button class="nav" data-page="grades">Test scores</button><button class="nav" data-page="study">Study time</button><button class="nav" data-page="notes">Notes</button><button class="nav" data-page="calendar">Calendar</button><button class="nav" data-page="flashcards">Flashcards</button><button class="nav" data-page="exams">Exams</button><button class="nav" data-page="goals">Weekly goals</button><button class="nav" data-page="settings">Settings</button></nav><div class="sidebar-bottom"><span class="saved-dot"></span> Saved on this device<br><small>Use Settings to back up your work.</small></div></aside><main class="main" id="main"><header class="topbar"><button id="menuBtn" class="mobile-menu" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">Menu</button><div><div class="eyebrow" id="dateLabel"></div><h1 id="pageTitle">Dashboard</h1></div><div class="header-actions"><button id="tourLaunch" class="tour-launch" type="button" title="Learn how StudySpace works">Take a tour</button><div class="profile" id="profileChip">My space</div></div></header><div id="content" class="content"></div></main></div><nav class="bottom-nav" aria-label="Quick navigation"><button type="button" data-page="dashboard">Home</button><button type="button" data-page="assignments">Homework</button><button type="button" data-page="calendar">Calendar</button><button type="button" data-page="notes">Notes</button><button type="button" id="moreNav">More</button></nav><div id="toast" role="status" aria-live="polite"></div>
<div id="onboarding" class="onboarding" hidden>
  <div class="onboarding-shade"></div>
  <section class="onboarding-dialog" role="dialog" aria-modal="true" aria-labelledby="onboardTitle" aria-describedby="onboardDescription" tabindex="-1">
    <div class="onboard-head"><div class="onboard-mark">S<span>.</span></div><button id="onboardClose" class="onboard-close" type="button" aria-label="Close introduction">Skip tour</button></div>
    <div class="onboard-step" id="onboardCounter" aria-live="polite"></div>
    <div class="onboard-progress" aria-hidden="true"><span id="onboardProgress"></span></div>
    <h2 id="onboardTitle"></h2><p id="onboardDescription"></p>
    <div id="onboardFields" class="onboard-fields"></div>
    <div id="onboardPreview" class="onboard-preview"></div>
    <div class="onboard-foot"><button id="onboardBack" class="onboard-secondary" type="button">Back</button><button id="onboardNext" class="onboard-primary" type="button">Next</button></div>
  </section>
</div><script src="script.js"></script><script src="app-shell.js" defer></script></body></html>
